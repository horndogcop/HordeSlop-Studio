name: Release APK & AAB

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Android versionCode override (optional; defaults to commit count)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean
      generate_notes:
        description: "Auto-generate release notes"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version }}"
          version_name="${raw#v}"
          if [ -z "$version_name" ]; then
            echo "Version cannot be empty" >&2
            exit 1
          fi
          release_tag="v${version_name}"
          if [ -n "${{ inputs.version_code }}" ]; then
            version_code="${{ inputs.version_code }}"
          else
            version_code="$(git rev-list --count HEAD)"
          fi
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Decode Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required repository secret: $var" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
          echo "ANDROID_KEYSTORE_FILE=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests, build signed APK & AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleRelease bundleRelease \
            --no-daemon --stacktrace \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Stage release artifacts & checksums
        shell: bash
        run: |
          tag="${{ steps.version.outputs.release_tag }}"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/hordecraft-${tag}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/hordecraft-${tag}.aab"
          (
            cd release-assets
            sha256sum "hordecraft-${tag}.apk" "hordecraft-${tag}.aab" > SHA256SUMS.txt
          )

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.release_tag }}"
          args=(
            "$tag"
            "release-assets/hordecraft-${tag}.apk"
            "release-assets/hordecraft-${tag}.aab"
            "release-assets/SHA256SUMS.txt"
            --target "$GITHUB_SHA"
            --title "Hordecraft ${tag}"
          )
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${{ inputs.generate_notes }}" = "true" ]; then
            args+=(--generate-notes)
          else
            args+=(--notes "Hordecraft ${tag}")
          fi
          gh release create "${args[@]}"
